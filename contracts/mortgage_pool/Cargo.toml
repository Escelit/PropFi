[package]
name = "propfi-mortgage-pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28"
propfi-types = { path = "../types" }
propfi-property-registry = { path = "../property_registry" }
propfi-oracle-adapter = { path = "../oracle_adapter" }

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
