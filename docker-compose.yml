version: "3.9"

services:
  stellar:
    image: stellar/quickstart:testing
    ports:
      - "8000:8000"
      - "11625:11625"
      - "11626:11626"
    command: [
      "--local", "--enable-soroban-rpc",
      "--protocol-version", "22",
      "--limits", "--max-contract-size", "1000000",
      "--max-ledger-entries", "1000000",
    ]
    volumes:
      - stellar-data:/opt/stellar

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: propfi
      POSTGRES_USER: propfi
      POSTGRES_PASSWORD: propfi
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  stellar-data:
  postgres-data:
